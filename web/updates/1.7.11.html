    <section id="updates" class="section" aria-labelledby="updates-title">
      <div class="section-heading"><p class="eyebrow">WHAT’S NEW</p><h2 id="updates-title">1.7.11 版本更新</h2><p class="section-lead">扩展坞让你按喜好给恶魔叮加动作、特效和声音。扩展可以单独安装和更新，关闭后恢复原来的表现。</p></div>
      <dl class="update-grid">
        <div><dt>扇翅飞行</dt><dd>待机巡游时会转身扇翅，从桌面一侧飞到另一侧。身体随翅膀起伏，尾巴跟着摆动，到达后落下停一会儿。</dd></div>
        <div><dt>视线跟随鼠标</dt><dd>恶魔叮闲着时，眼睛会跟着鼠标光标看。点一下它，仍会随机做动作并弹出表情。</dd></div>
        <div><dt>四款局部炫彩</dt><dd>星芒、菱晶、爱心和空心星可选，效果只出现在耳朵内侧、原有翅膀和尾巴中段，普通和异色皮肤都能用。</dd></div>
        <div><dt>三种互动语音</dt><dd>粗嗓门、婉转音和普通嗓音都来自录屏原声，每种包含八个互动的声音，可以先试听再选。</dd></div>
      </dl>
