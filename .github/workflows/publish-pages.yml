name: Publish PIGDING Pages

on:
  release:
    types: [published]
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'tools/**'
      - '.github/workflows/publish-pages.yml'

concurrency:
  group: pigding-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Fetch current release metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/$GITHUB_REPOSITORY/releases/latest" > "$RUNNER_TEMP/active-release.json"
      - name: Verify current ZIP and build the site with download mirrors
        env:
          PIGDING_OSS_ORIGIN: ${{ vars.PIGDING_OSS_ORIGIN }}
        run: |
          python3 tools/github_site.py build --repository "$GITHUB_REPOSITORY" \
            --release-json "$RUNNER_TEMP/active-release.json" --output _site \
            --oss-origin "$PIGDING_OSS_ORIGIN"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
